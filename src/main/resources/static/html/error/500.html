<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 - Error del servidor | LogiTrack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
<link rel="stylesheet" href="/css/ui-kit.css">
</head>
<body>
<div class="uikit-error-page uikit-error-page--500">
  <div class="uikit-error-page__card">
    <span class="material-symbols-outlined uikit-error-page__icon">dns</span>
    <p class="uikit-error-page__code">500</p>
    <h1 class="uikit-error-page__title">Error interno del servidor</h1>
    <p class="uikit-error-page__message">Ocurrió un problema inesperado. Intenta nuevamente en unos minutos.</p>
    <div class="uikit-error-page__actions">
      <button class="uikit-btn uikit-btn--outline" type="button" onclick="location.reload()">Reintentar</button>
      <a class="uikit-btn uikit-btn--primary" href="/html/dashboard.html">Ir al Dashboard</a>
    </div>
  </div>
</div>
</body>
</html>
